[package]
name = "fast_blf_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust decode core for Fast BLF Converter (PyO3 extension)"

[lib]
name = "fast_blf_core"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# extension-module 必须是可选 feature：
#   * maturin 构建时会自动启用它（生成不链接 libpython 的扩展模块）
#   * `cargo test` 保持关闭，否则在 macOS 上会因缺少 Python 符号而链接失败
[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310", "macros"] }
blf_asc = "0.2.0"
can-dbc = "10.0.0"
rayon = "1.12"
polars = { version = "0.55.2", features = [
    "lazy",
    "parquet",
    "csv",
    "streaming",
    "asof_join",
    "interpolate",
] }
rust_xlsxwriter = { version = "0.99.1", features = ["constant_memory"] }
zstd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Step 7b：BLF 文件头墙钟 → epoch，仅新增此依赖（已是 blf_asc 的传递依赖）。
chrono = "0.4"
# Step 9：DBC 预规范化（GBK/GB18030 解码），纯 Rust 无 C 依赖。
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"
